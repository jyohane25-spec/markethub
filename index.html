<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MarketHub</title><link rel="manifest" href="manifest.json"><meta name="theme-color" content="#2563eb"><link rel="stylesheet" href="style.css"></head><body>
<header class="topbar"><div class="brand">Market<span>Hub</span></div><button id="sellTopBtn" class="primary small">+ Sell Item</button></header>
<main><section class="hero"><div><p class="eyebrow">YOUR LOCAL MARKETPLACE</p><h1>Buy and sell things<br>near you.</h1><p class="sub">Real listings. Real sellers. Simple buying.</p></div><div class="hero-card">🛍️</div></section>
<section class="search-area"><input id="searchInput" type="search" placeholder="Search for phones, clothes, furniture..."></section>
<section class="categories"><button class="cat active" data-cat="All">All</button><button class="cat" data-cat="Phones">📱 Phones</button><button class="cat" data-cat="Electronics">💻 Electronics</button><button class="cat" data-cat="Fashion">👕 Fashion</button><button class="cat" data-cat="Home">🏠 Home</button><button class="cat" data-cat="Vehicles">🚗 Vehicles</button><button class="cat" data-cat="Other">🛍️ Other</button></section>
<section class="section-head"><h2>Latest listings</h2><span id="count">Loading...</span></section><section id="status" class="status hidden"></section><section id="listings" class="grid"></section></main><button id="floatingSell" class="floating">＋</button>
<div id="modal" class="modal hidden"><div class="modal-box"><button id="closeModal" class="close">×</button><h2>List an item</h2><p class="muted">Add a photo and your item will be visible to other visitors.</p><form id="listingForm">
<label>Item photo<input id="itemImage" type="file" accept="image/jpeg,image/png,image/webp" required><small>JPG, PNG or WebP · max 5 MB</small></label><label>Item name<input id="itemName" required maxlength="120" placeholder="e.g. iPhone 13"></label><label>Price (ZMW)<input id="itemPrice" required type="number" min="0" placeholder="4500"></label><label>Category<select id="itemCategory"><option>Phones</option><option>Electronics</option><option>Fashion</option><option>Home</option><option>Vehicles</option><option>Other</option></select></label><label>Location<input id="itemLocation" required maxlength="120" placeholder="e.g. Lusaka"></label><label>Seller phone<input id="itemPhone" required maxlength="40" type="tel" placeholder="+260 ..."></label><label>Description<textarea id="itemDescription" rows="3" maxlength="1000" placeholder="Describe the item"></textarea></label><button id="publishBtn" class="primary full" type="submit">Publish listing</button></form></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="app.js"></script></body></html>
